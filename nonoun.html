<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>NoNoun</title>
    <link rel="stylesheet" href="nonoun.css" />
</head>
<body>
    <header>
        <span>Make this page gender-neutral?</span>
        <button id="CloseIcon" aria-label="Close">&#x2715;</button>
    </header>
    <main>
        <form id="SettingsForm">
            <div class="field-row">
                <label for="HeReplacement">Replace "he" with</label>
                <input type="text" id="HeReplacement" maxlength="20" />
            </div>
            <div class="field-row">
                <label for="SheReplacement">Replace "she" with</label>
                <input type="text" id="SheReplacement" maxlength="20" />
            </div>
            <div class="field-row">
                <label for="HimReplacement">Replace "him" with</label>
                <input type="text" id="HimReplacement" maxlength="20" />
            </div>
            <div class="field-row">
                <label for="HerReplacement">Replace "her" with</label>
                <input type="text" id="HerReplacement" maxlength="20" />
            </div>
            <div class="field-row">
                <label for="HisReplacement">Replace "his" with</label>
                <input type="text" id="HisReplacement" maxlength="20" />
            </div>
            <div class="field-row">
                <label for="HersReplacement">Replace "hers" with</label>
                <input type="text" id="HersReplacement" maxlength="20" />
            </div>

            <div class="button-row">
                <button type="button" id="GoNoNounButton">
                    Go! <span id="WaitSpinner" class="spinner" aria-hidden="true"></span>
                </button>
            </div>

            <div class="radio-group">
                <label><input type="radio" name="auto" value="manual" /> Only when I hit the "Go!" button</label>
                <label><input type="radio" name="auto" value="on" /> Run on all web pages, except these</label>
                <label><input type="radio" name="auto" value="off" /> Don't run for any web pages, except these</label>
            </div>

            <div id="UrlList"></div>
        </form>
    </main>
    <footer>
        For more info: <a target="_blank" rel="noopener" href="https://rocketsocks.com/nonoun">rocketsocks.com/nonoun</a>
    </footer>

    <script src="words.js"></script>
    <script src="common.js"></script>
    <script src="nonoun.js"></script>
</body>
</html>
